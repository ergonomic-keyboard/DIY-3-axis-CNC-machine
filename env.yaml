# Conda environment for the DIY-3-axis-CNC-machine shopping / documentation site.
#
#   conda env create -f env.yaml     # first time (creates env "cnc-docs")
#   conda activate cnc-docs
#   python tools/dev.py              # serves the site + price write-through helper
#
# Why this file exists: mkdocs.yml uses the Material theme and the pymdownx
# markdown extensions. A bare `mkdocs` install (e.g. conda "base") does NOT
# ship those, so `mkdocs serve` aborts with:
#     Config value 'theme': Unrecognised theme name: 'material'
# Installing mkdocs-material pulls in mkdocs + pymdown-extensions together,
# matching what CI (.github/workflows/ci.yml) installs before `mkdocs gh-deploy`.
#
# The tools/ helpers (dev.py, refresh_server.py, refresh_prices.py,
# merge_user_data.py) are stdlib-only, so no other runtime deps are needed here.
#
# NOTE: this env is for the WEBSITE only. The metal CAD scripts have their own
# deps in hardware_mods/metal_plates/requirements.txt, and the FreeCAD render
# pipeline uses a separately-installed FreeCAD app — neither belongs here.
name: cnc-docs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - mkdocs-material=9.6
