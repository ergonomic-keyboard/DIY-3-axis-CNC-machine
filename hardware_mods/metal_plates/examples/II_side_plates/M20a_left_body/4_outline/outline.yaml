# ============================================================================
#  M20a  —  LEFT SIDE PLATE  ·  OUTLINE (silhouette) specification
# ============================================================================
#  Human source of truth for the plate's outline. Edit this, then run:
#     python hardware_mods/metal_plates/expand_outline.py --example <part folder>
#  to compile it into outline.json, which build_model.py reads (preferred over
#  the raw/edited *_polygon.json traces). Companion to holes.yaml.
#
#  The outline lies in the X-Z plane (X = across the plate, Z = up); build_model
#  extrudes it along +Y to the plate thickness. Vertices are listed IN ORDER
#  around the polygon (it auto-closes: last -> first).
#
#  Each vertex owns the EDGE that LEAVES it toward the next vertex:
#     edge.constraint :  free | horizontal | vertical
#        (used by align_outline.py to snap nearly-H/V edges perfectly straight;
#         'free' = a true diagonal, e.g. a chamfer)
#     edge.group      :  integer; edges sharing a group are treated together.
#  Add a `comment:` to any vertex to label a corner / chamfer / notch.
#
#  HOW TO edit the shape:
#     * move a corner        -> change its x / z
#     * make an edge straight -> set the leaving edge's constraint to
#                                horizontal or vertical (then re-run expand)
#     * keep a chamfer/diagonal -> leave constraint: free
# ============================================================================

meta:
  part: M20a_left_body
  coords: mm
  closed: true
  plane: XZ            # outline in X-Z; extruded along +Y by build_model

