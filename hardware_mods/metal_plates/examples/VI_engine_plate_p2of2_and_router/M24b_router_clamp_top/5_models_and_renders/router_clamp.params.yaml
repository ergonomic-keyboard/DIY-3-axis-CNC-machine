# Parameters for M24b_router_clamp_top (router_clamp.py).
# Editing a value here overrides the same-named constant in the script
# (values below equal the script defaults). Numbers are millimetres unless
# the script comment says otherwise. Derived values (e.g. a midpoint) are
# snapshots — if you change what they depend on, update them here too.

PLATE_WIDTH: 110   # X — along Z plate face (left/right)
PLATE_DEPTH: 100   # Y — sticking out from Z plate
PLATE_THICK: 12   # Z — vertical thickness (along router axis)
BORE_DIAM: 65   # router OD (Makita RT0700 = 65 mm)
BORE_CENTER_Y: 8   # bore centre Y, measured from plate centre toward
SAW_SLIT_WIDTH: 2.5   # slit goes from bore wall to the +Y front edge.
CROSS_BOLT_DIAM: 6.5
CROSS_BOLT_Y: 45.5   # 5 mm past bore edge
MOUNT_BOLT_DIAM: 5.5
MOUNT_X_PITCH: 80
MOUNT_Y_OFFSET: -42   # 8 mm from the back edge
